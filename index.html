<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Harbourline Clinical Care secure client portal for prescriptions, document requests, clinical guides, and after-hours nursing triage." />
    <title>Harbourline Clinical Care — Secure Client Access</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
      /* Critical inline CSS: prevent white flash, define baseline paper theme */
      :root {
        --bg: #F6F3EE;
        --surface: #FFFFFF;
        --surface-raised: #FBF9F5;
        --primary: #1F4D45;
        --primary-hover: #17403A;
        --primary-active: #123530;
        --secondary: #DCE7E1;
        --accent: #B5542F;
        --accent-soft: #F4E3DA;
        --text: #1B2421;
        --text-2: #4A5753;
        --muted: #7A8680;
        --border: #E3DED5;
        --border-strong: #CFC8BC;
        --success: #2F7A55;
        --warning: #A8741A;
        --error: #B03A2E;
        --info: #2F5F8A;
        --focus: #2B6CB0;
        --shell-bg: #ECE7DF;
        --shell-ink: #1B2421;
      }

      html, body {
        margin: 0;
        padding: 0;
        background-color: #ECE7DF;
        color: #1B2421;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      /* On mobile viewports, the body directly uses the app warm paper background */
      @media (max-width: 1023px) {
        html, body {
          background-color: #F6F3EE;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
